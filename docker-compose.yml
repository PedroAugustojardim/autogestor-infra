services:
  autogestor-cache:
    image: redis:7-alpine
    container_name: autogestor-cache
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  autogestor-queue:
    image: venatum/bull-board:latest
    container_name: autogestor-queue
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: autogestor-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Sem login/senha aqui o board (que mostra payload dos jobs) fica aberto pra
      # qualquer um que alcance a porta 3001 — só ativa quando os dois estão setados.
      USER_LOGIN: ${BULL_BOARD_USER}
      USER_PASSWORD: ${BULL_BOARD_PASSWORD}
    depends_on:
      - autogestor-cache
    restart: unless-stopped

volumes:
  redis_data:
